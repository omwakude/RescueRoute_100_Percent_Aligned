<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RescueRoute | Admin Dispatch</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body class="app-bg">
<nav class="navbar navbar-dark bg-dark shadow-sm"><div class="container-fluid px-4"><span class="navbar-brand fw-bold">🚑 RescueRoute Dispatch Control</span><div class="d-flex align-items-center gap-2"><span class="live-dot"></span><span class="text-white small">LIVE</span><a href="/" class="btn btn-sm btn-outline-light">Emergency Maker</a><a href="/command" class="btn btn-sm btn-warning">God View</a></div></div></nav>
<main class="container-fluid p-3 p-lg-4"><div class="row g-3"><div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-header bg-white fw-bold">🚨 Priority Queue <span id="waitingCount" class="badge bg-danger float-end">0</span></div><div id="emergencyList" class="list-group list-group-flush"></div></div></div><div class="col-lg-8"><div class="card border-0 shadow-sm mb-3"><div class="card-header bg-white"><div class="fw-bold">Dispatch Decision</div><div id="selectedEmergency" class="small text-secondary">Highest-priority waiting emergency is processed first.</div></div><div class="card-body"><div id="dispatchPanel"></div></div></div>
<div class="row g-3"><div class="col-md-6"><div class="card border-0 shadow-sm h-100"><div class="card-header bg-white fw-bold">🚧 Road & Traffic Control</div><div class="card-body"><div class="row g-2"><div class="col-6"><input id="roadSource" class="form-control" placeholder="Source e.g. node_1"></div><div class="col-6"><input id="roadDestination" class="form-control" placeholder="Destination e.g. node_2"></div><div class="col-6"><button class="btn btn-danger w-100" onclick="roadAction('block')">Block Road</button></div><div class="col-6"><button class="btn btn-success w-100" onclick="roadAction('open')">Open Road</button></div><div class="col-7"><input id="roadMinutes" type="number" step="0.01" min="0.01" class="form-control" placeholder="New base time (minutes)"></div><div class="col-5"><button class="btn btn-primary w-100" onclick="updateRoadTime()">Update Time</button></div><div class="col-6"><button class="btn btn-outline-dark w-100" onclick="showRoadCondition()">Road Condition</button></div><div class="col-6"><button class="btn btn-warning w-100" onclick="refreshTraffic()">Update Traffic</button></div></div><pre id="roadResult" class="small bg-light p-2 rounded mt-3 mb-0" style="max-height:180px;overflow:auto">Road controls ready.</pre></div></div></div>
<div class="col-md-6"><div class="card border-0 shadow-sm h-100"><div class="card-header bg-white fw-bold">📚 Emergency History</div><div class="card-body"><div class="input-group mb-2"><input id="historyId" class="form-control" placeholder="Emergency ID e.g. 1001"><button class="btn btn-dark" onclick="searchHistory()">Search</button></div><button class="btn btn-outline-secondary btn-sm mb-2" onclick="loadHistory()">Display Emergency History</button><pre id="historyResult" class="small bg-light p-2 rounded mb-0" style="max-height:230px;overflow:auto">No history loaded.</pre></div></div></div></div>
</div></div></main><script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script><script src="/js/admin.js"></script></body></html>
