<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RescueRoute | Emergency Maker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-bg"><nav class="navbar navbar-dark bg-danger shadow-sm"><div class="container"><span class="navbar-brand fw-bold">🚑 RescueRoute</span><div><a class="btn btn-sm btn-light me-1" href="/admin">Admin</a><a class="btn btn-sm btn-outline-light" href="/command">God View</a></div></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-xl-10"><div class="card border-0 shadow-lg"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><div class="display-5">🚨</div><h1 class="fw-bold mb-1">Register Emergency</h1><p class="text-secondary mb-0">Emergency ID is generated automatically. Priority is derived from emergency type.</p></div>
<form id="emergencyForm"><div class="row g-3"><div class="col-md-7"><label class="form-label fw-semibold">Patient Name</label><input id="patient_name" class="form-control" required></div><div class="col-md-2"><label class="form-label fw-semibold">Age</label><input id="patient_age" type="number" min="0" max="130" class="form-control" required></div><div class="col-md-3"><label class="form-label fw-semibold">Sex</label><select id="patient_sex" class="form-select" required><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Emergency Type</label><select id="emergency_type" class="form-select" required><option value="0">0 → Minor Injury</option><option value="1">1 → Serious Injury</option><option value="2">2 → Cardiac</option><option value="3">3 → Neonatal</option><option value="4">4 → Trauma</option><option value="5">5 → Critical</option></select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Destination Hospital</label><select id="destination_hospital" class="form-select" required><option value="AUTO">System Recommended (medical suitability + fastest Dijkstra route)</option><option value="201">201 → Sancheti Hospital</option><option value="202">202 → Ruby Hall Clinic</option><option value="203">203 → Jehangir Hospital</option><option value="204">204 → KEM Hospital</option><option value="205">205 → Sassoon General</option></select><div class="form-text">Admin can still manually choose any medically suitable hospital after recommendation.</div></div></div>
<hr class="my-4"><label class="form-label fw-semibold">Patient Location</label><div class="d-flex gap-2 mb-3"><button type="button" id="locateBtn" class="btn btn-outline-primary flex-fill">📍 Use My Current Location</button><button type="button" id="clearLocation" class="btn btn-outline-secondary">Clear</button></div><div id="map"></div><div class="row mt-3"><div class="col-md-6"><label class="form-label">Latitude</label><input id="lat" class="form-control" type="number" step="any" value="18.5295" required></div><div class="col-md-6"><label class="form-label">Longitude</label><input id="lng" class="form-control" type="number" step="any" value="73.8560" required></div></div><div id="locationStatus" class="small text-secondary mt-2">Click the map or use GPS.</div><button id="submitBtn" type="submit" class="btn btn-danger btn-lg w-100 mt-4">🚑 REGISTER EMERGENCY</button></form><div id="statusBox" class="mt-4 d-none"></div>
</div></div></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/emergency.js"></script></body></html>
