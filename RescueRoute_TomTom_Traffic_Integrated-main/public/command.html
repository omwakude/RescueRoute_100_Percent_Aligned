<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueRoute | Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="command-bg">
<nav class="navbar navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid px-3">
        <span class="navbar-brand fw-bold">🚨 RESCUEROUTE COMMAND CENTER</span>
        <div class="d-flex align-items-center gap-2">
            <span class="live-dot"></span>
            <span id="trafficProvider" class="badge bg-secondary">TRAFFIC: CHECKING</span><span class="text-white small">SYSTEM LIVE</span>
            <a href="/" class="btn btn-sm btn-outline-light">Emergency</a>
            <a href="/admin" class="btn btn-sm btn-outline-warning">Admin</a>
        </div>
    </div>
</nav>

<div class="container-fluid p-3">
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="stat-card"><div class="stat-number" id="statEmergencies">0</div><div>🚨 Emergencies</div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card"><div class="stat-number" id="statAvailable">0</div><div>🟢 Available Ambulances</div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card"><div class="stat-number" id="statDispatched">0</div><div>🔵 Dispatched</div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card"><div class="stat-number" id="statHospitals">0</div><div>🏥 Hospitals</div></div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-xl-9">
            <div class="map-shell">
                <div id="commandMap"></div>
                <div class="map-legend">
                    <span>🚨 Emergency</span>
                    <span>🟢 Available</span>
                    <span>🚑 Active Ambulance</span>
                    <span>🏥 Hospital</span>
                    <span>🚧 Traffic</span>
                </div>
            </div>
        </div>

        <div class="col-xl-3">
            <div class="side-panel">
                <h6 class="fw-bold">LIVE ACTIVITY</h6>
                <div id="activityFeed" class="activity-feed"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script src="/js/command.js"></script>
</body>
</html>
